<!-- Descripción: Página estática que se muestra cuando un usuario no autorizado intenta acceder. -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md fade-in text-center border border-slate-200">
            <div class="bg-red-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
                <span id="unauthorized-icon"></span>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Acceso Restringido</h1>
            <p class="text-slate-500 text-lg mb-6">
                El usuario <span class="font-semibold text-slate-900" id="user-email">(desconocido)</span> no tiene permisos para acceder a esta aplicación.
            </p>
            <p class="text-xs text-slate-400">Contacta con el <a href="mailto:<?= ADMIN_EMAIL ?>" class="text-blue-500 hover:underline">soporte</a> si crees que es un error.</p>
        </div>
    </div>
    <script>
        // Función simple para renderizar iconos de Lucide sin React
        function renderLucideIcon(name, size = 20, className = "") {
            const iconNode = lucide.icons[name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('')];
            if (iconNode && typeof lucide.createElement === 'function') {
                const svgElement = lucide.createElement(iconNode);
                svgElement.setAttribute('width', size);
                svgElement.setAttribute('height', size);
                svgElement.setAttribute('class', className);
                return svgElement.outerHTML;
            }
            return '';
        }

        // Inyecta el email del usuario y renderiza el icono
        document.addEventListener('DOMContentLoaded', () => {
            const userEmail = "<?= userEmail ?>";
            
            const iconContainer = document.getElementById('unauthorized-icon');
            if (iconContainer) {
                iconContainer.innerHTML = renderLucideIcon('shield-alert', 40, '');
            }

            const emailSpan = document.getElementById('user-email');
            if (emailSpan && userEmail) {
                emailSpan.textContent = userEmail;
            }
        });
    </script>
</body>
</html>
